<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AUREX GT-RS — Engineered to Dominate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"
<link rel=""stylesheet"href="style.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    font-family:'Jost','Trebuchet MS','Century Gothic',sans-serif;
  }
  .stage { padding:40px 20px; }
  .poster {
    position:relative;
    width:900px;
    height:1125px;
    overflow:hidden;
    border-radius:6px;
    box-shadow:0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.06);
    background:#04060a;
  }
  .poster svg { position:absolute; top:0; left:0; right:0; bottom:0; width:100%; height:100%; display:block; }

  .content {
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:5;
    pointer-events:none;
  }
  .brandmark {
    margin-top:6.5%;
    color:#f2e6c9;
    font-family:'Oswald','Arial Narrow',Impact,sans-serif;
    font-weight:500;
    font-size:15px;
    letter-spacing:10px;
    opacity:0.88;
  }
  .brandmark span { color:#c9a24b; }

  .bottom-block {
    margin-top:auto;
    margin-bottom:6.8%;
    width:100%;
    text-align:center;
    padding:0 6%;
  }
  .headline {
    font-family:'Oswald','Arial Narrow',Impact,sans-serif;
    font-weight:700;
    font-size:52px;
    letter-spacing:2px;
    color:#f5f6f8;
    text-shadow:0 0 26px rgba(201,162,75,0.35), 0 2px 10px rgba(0,0,0,0.8);
    line-height:1.02;
  }
  .model {
    margin-top:16px;
    font-family:'Oswald','Arial Narrow',Impact,sans-serif;
    font-weight:600;
    font-size:27px;
    letter-spacing:7px;
    color:#c9a24b;
    text-shadow:0 0 18px rgba(201,162,75,0.55);
  }
  .divider {
    width:64px;
    height:1px;
    background:linear-gradient(90deg, transparent, #6b7280, transparent);
    margin:18px auto;
    opacity:0.7;
  }
  .tagline {
    font-family:'Jost','Trebuchet MS','Century Gothic',sans-serif;
    font-weight:300;
    font-size:14px;
    letter-spacing:5px;
    color:#aab0bc;
    text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="poster">

    <svg viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#02030a"/>
          <stop offset="45%" stop-color="#060a17"/>
          <stop offset="72%" stop-color="#0d1424"/>
          <stop offset="100%" stop-color="#1a1a1e"/>
        </linearGradient>

        <radialGradient id="glow" cx="50%" cy="100%" r="75%">
          <stop offset="0%" stop-color="#7a5a26" stop-opacity="0.55"/>
          <stop offset="35%" stop-color="#4a3a22" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#171a20"/>
          <stop offset="100%" stop-color="#020304"/>
        </linearGradient>

        <linearGradient id="bodyMetal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#eef1f5"/>
          <stop offset="30%" stop-color="#b9bfc8"/>
          <stop offset="55%" stop-color="#7d838d"/>
          <stop offset="80%" stop-color="#40434b"/>
          <stop offset="100%" stop-color="#1c1e22"/>
        </linearGradient>

        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#3a4552"/>
          <stop offset="100%" stop-color="#0c0f14"/>
        </linearGradient>

        <linearGradient id="reflFade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#9aa0aa" stop-opacity="0.32"/>
          <stop offset="100%" stop-color="#9aa0aa" stop-opacity="0"/>
        </linearGradient>

        <radialGradient id="underglow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#d9a548" stop-opacity="0.65"/>
          <stop offset="100%" stop-color="#d9a548" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="rimlight" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#eaeef5" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#eaeef5" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="vignetteBottom" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
        </linearGradient>

        <filter id="blurSm"><feGaussianBlur stdDeviation="6"/></filter>
        <filter id="blurMd"><feGaussianBlur stdDeviation="16"/></filter>
        <filter id="blurLg"><feGaussianBlur stdDeviation="34"/></filter>
      </defs>

      <rect x="0" y="0" width="1200" height="1500" fill="url(#sky)"/>
      <rect x="0" y="600" width="1200" height="500" fill="url(#glow)"/>

      <circle cx="600" cy="560" r="230" fill="url(#underglow)" opacity="0.5" filter="url(#blurLg)"/>

      <g opacity="0.9">

        <rect x="70" y="620" width="8" height="12"/><rect x="16" y="660" width="8" height="12"/>
        <rect x="140" y="500" width="7" height="10"/><rect x="165" y="560" width="7" height="10"/>
        <rect x="140" y="620" width="7" height="10"/><rect x="280" y="540" width="7" height="10"/>
        <rect x="280" y="620" width="7" height="10"/><rect x="1010" y="520" width="7" height="10"/>
        <rect x="1010" y="600" width="7" height="10"/><rect x="1070" y="580" width="7" height="10"/>
        <rect x="1070" y="650" width="7" height="10"/><rect x="1150" y="510" width="7" height="10"/>
        <rect x="1150" y="600" width="7" height="10"/><rect x="920" y="640" width="7" height="10"/>

      <rect x="0" y="850" width="1200" height="650" fill="url(#road)"/>

      <path d="M596,860 L604,860 L640,1080 L560,1080 Z" fill="#3a3d44" opacity="0.35"/>
      <path d="M600,1140 L600,1210" stroke="#4a4d54" stroke-width="10" opacity="0.4"/>
      <path d="M598,1250 L602,1250 L610,1330 L590,1330 Z" fill="#4a4d54" opacity="0.35"/>

      <ellipse cx="600" cy="1178" rx="330" ry="46" fill="url(#underglow)" filter="url(#blurMd)" opacity="0.8"/>

      <g transform="translate(240,930) scale(1,-1) translate(0,-330)" opacity="0.28">
        <g transform="translate(0,0)">
          <path d="M40,205 C42,178 66,156 108,150 L235,142 C258,105 315,72 385,64 C452,58 505,66 545,84
                   C578,98 606,112 636,132 L672,142 C702,148 720,164 724,186 L724,205
                   C700,215 660,222 610,224 L520,224 C500,236 468,244 435,244 C402,244 370,236 350,224
                   L300,224 C280,236 248,244 215,244 C182,244 150,236 130,224 L70,224
                   C52,220 40,214 40,205 Z" fill="url(#bodyMetal)"/>
        </g>

      <rect x="120" y="1150" width="960" height="120" fill="url(#reflFade)" opacity="0.5"/>

      <g transform="translate(240,600)">
        <ellipse cx="290" cy="292" rx="80" ry="14" fill="#000" opacity="0.5" filter="url(#blurSm)"/>
        <ellipse cx="610" cy="298" rx="90" ry="16" fill="#000" opacity="0.5" filter="url(#blurSm)"/>

        <path d="M40,205 C42,178 66,156 108,150 L235,142 C258,105 315,72 385,64 C452,58 505,66 545,84
                 C578,98 606,112 636,132 L672,142 C702,148 720,164 724,186 L724,205
                 C700,215 660,222 610,224 L520,224 C500,236 468,244 435,244 C402,244 370,236 350,224
                 L300,224 C280,236 248,244 215,244 C182,244 150,236 130,224 L70,224

        <path d="M260,138 C285,102 330,76 385,66 C440,58 486,64 520,78 L505,132

        <path d="M108,152 C150,146 200,142 240,140 C238,146 236,152 235,158 C195,160 150,163 112,168 Z"
              fill="#f4f0e6" opacity="0.75"/>
        <path d="M120,160 C260,146 420,140 560,148 C610,152 660,158 700,168" fill="none"
              stroke="#eef1f5" stroke-width="3" opacity="0.55"/>

        <rect x="58" y="182" width="46" height="10" rx="4" fill="#f7f4ea"/>
        <rect x="60" y="184" width="42" height="6" rx="3" fill="#fff7de"/>
        <rect x="672" y="176" width="34" height="14" rx="4" fill="#e2452f"/>
        <rect x="676" y="179" width="26" height="8" rx="3" fill="#ff7a5c"/>

        <path d="M540,86 C566,98 592,110 618,128" fill="none" stroke="#2a2d33" stroke-width="6" opacity="0.5"/>

        <circle cx="290" cy="256" r="66" fill="#0d0e10"/>
        <circle cx="290" cy="256" r="66" fill="none" stroke="#3a3d44" stroke-width="2"/>
        <circle cx="290" cy="256" r="40" fill="#3a3d44"/>
        <circle cx="290" cy="256" r="14" fill="#c9a24b"/>
        <g stroke="#8b8e96" stroke-width="3">
          <line x1="290" y1="222" x2="290" y2="238"/>
          <line x1="290" y1="274" x2="290" y2="290"/>
          <line x1="256" y1="256" x2="272" y2="256"/>
          <line x1="308" y1="256" x2="324" y2="256"/>
          <line x1="266" y1="232" x2="278" y2="244"/>
          <line x1="302" y1="268" x2="314" y2="280"/>
          <line x1="314" y1="232" x2="302" y2="244"/>
          <line x1="278" y1="268" x2="266" y2="280"/>
        </g>

        <circle cx="610" cy="262" r="72" fill="#0d0e10"/>
        <circle cx="610" cy="262" r="72" fill="none" stroke="#3a3d44" stroke-width="2"/>
        <circle cx="610" cy="262" r="44" fill="#3a3d44"/>
        <circle cx="610" cy="262" r="15" fill="#c9a24b"/>

          <line x1="610" y1="224" x2="610" y2="242"/>

          <line x1="572" y1="262" x2="590" y2="262"/>
          <line x1="630" y1="262" x2="648" y2="262"/>
          <line x1="583" y1="235" x2="596" y2="248"/>

          <line x1="637" y1="235" x2="624" y2="248"/>
          <line x1="596" y1="276" x2="583" y2="289"/>
        </g>

        <circle cx="360" cy="120" r="46" fill="url(#rimlight)" opacity="0.5" filter="url(#blurMd)"/>
        <circle cx="55" cy="185" r="18" fill="url(#rimlight)" opacity="0.75" filter="url(#blurSm)"/>
        <circle cx="690" cy="182" r="16" fill="#e2452f" opacity="0.6" filter="url(#blurSm)"/>
      </g>

      <rect x="0" y="0" width="1200" height="1500" fill="url(#vignetteBottom)"/>
      <rect x="0" y="0" width="1200" height="1500" fill="none" stroke="#000" stroke-width="0"/>
    </svg>

    <div class="content">
      <div class="brandmark">A U R E X <span>&#9670;</span> M O T O R S</div>
      <div class="bottom-block">
        <div class="headline">ENGINEERED TO<br>DOMINATE</div>
        <div class="model">AUREX GT&#8209;RS</div>
        <div class="divider"></div>
        <div class="tagline">Performance Beyond Limits</div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
